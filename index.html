<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#022b16,#071f13);
color:white;
text-align:center;
}

.container{
max-width:420px;
margin:auto;
padding:30px 20px;
}

/* Photo Logo */

.logo{
width:120px;
height:120px;
border-radius:50%;
margin:auto;
overflow:hidden;

box-shadow:
0 0 10px #00ffae,
0 0 25px #00ffae,
0 0 50px #00ffae;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

/* MATCH EXPERT glow */

h1{

font-size:36px;
margin-top:20px;

text-shadow:
0 0 5px #00ffae,
0 0 10px #00ffae,
0 0 20px #00ffae;

animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
text-shadow:0 0 10px #00ffae;
}

to{
text-shadow:0 0 30px #00ffae;
}

}

.sub{
margin-top:10px;
color:#cde7d5;
}

.members{
margin-top:10px;
font-size:18px;
color:#7dd3fc;
}

.stats{
display:flex;
justify-content:space-between;
margin-top:25px;
}

.box{
border:1px solid #3fa77a;
border-radius:12px;
padding:12px;
width:30%;
}

/* Button animation */

.btn{

margin-top:35px;
display:inline-block;
padding:16px 30px;
font-size:18px;

border-radius:40px;
text-decoration:none;

color:white;

background:linear-gradient(90deg,#0ea5e9,#2563eb);

animation:pulse 1.5s infinite;

}

@keyframes pulse{

0%{transform:scale(1)}

50%{transform:scale(1.1)}

100%{transform:scale(1)}

}

.footer{
margin-top:40px;
font-size:13px;
color:#9bd3b0;
}

</style>

</head>
